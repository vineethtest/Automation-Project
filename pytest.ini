[pytest]
# Task 3 - pytest configuration (ASYNC version)
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
# pytest-asyncio: every `async def` test/fixture runs automatically,
# all on ONE session-wide event loop (needed because `browser` is session-scoped).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra -v --strict-markers --screenshot only-on-failure --tracing retain-on-failure --output reports/artifacts --html=reports/report.html --self-contained-html
markers =
    smoke: quick sanity tests (run with: pytest -m smoke)
    regression: full regression tests (run with: pytest -m regression)
    matrix: tests used for the browser execution matrix
    dynamic: tests for dynamic / SPA synchronization
    slow: tests that intentionally wait for a timeout
